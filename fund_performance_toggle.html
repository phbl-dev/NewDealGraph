    function getResponsiveFontSize() {
      const w = window.innerWidth;
      if (w > 1000) return 18;
      if (w > 700)  return 14;
      return 10;
    }

    function alignButtonsWithGraph() {
      setTimeout(() => {
        const graphDiv = document.getElementById("graph");
        const btnContainer = document.getElementById("button-container");
        if (!graphDiv || !btnContainer) return;
        const margin = graphDiv._fullLayout?.margin?.l ?? 80;
        btnContainer.style.paddingLeft = margin + "px";
      }, 100);
    }

    function applyButtonStyles() {
      const graphDiv = document.getElementById("graph");
      if (!graphDiv) return;
      graphDiv.querySelectorAll(".updatemenu-button").forEach(btn => {
        const rect = btn.querySelector("rect");
        const text = btn.querySelector("text");
        if (!rect) return;
        const isActive = btn.classList.contains("active");
        rect.setAttribute("fill",         isActive ? "#1B3C76" : "white");
        rect.setAttribute("stroke",       "#1B3C76");
        rect.setAttribute("stroke-width", "1.5");
        if (text) text.setAttribute("fill", isActive ? "white" : "#1B3C76");
      });
    }

    function styleActiveButton() {
      setTimeout(applyButtonStyles, 120);
    }

    function attachButtonClickListeners() {
      const graphDiv = document.getElementById("graph");
      if (!graphDiv) return;
      graphDiv.querySelectorAll(".updatemenu-button").forEach(btn => {
        btn.addEventListener("click", () => setTimeout(applyButtonStyles, 80));
      });
    }

    function setActiveTopButton(view) {
      document.querySelectorAll("#button-container button").forEach(btn => {
        btn.classList.remove("active");
        if (btn.getAttribute("onclick") && btn.getAttribute("onclick").includes("'" + view + "'")) {
          btn.classList.add("active");
        }
      });
    }

        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        "updatemenus[0].font.size": getResponsiveFontSize()
      });

      Plotly.newPlot("graph", graphData.data, layout, {
        responsive:     true,
        displayModeBar: false,
        scrollZoom:     false,
        doubleClick:    false
      }).then(() => {
        alignButtonsWithGraph();
        styleActiveButton();
        attachButtonClickListeners();
      });
    }

    window.addEventListener("resize", () => {
      if (window._lastView) loadGraph(window._lastView);
    });

    loadGraph("adjusted");
  </script>
</body>
</html>

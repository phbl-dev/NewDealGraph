    function getResponsiveFontSize() {
      const w = window.innerWidth;
      if (w > 1000) return 18;
      if (w > 700)  return 14;
      return 10;
    }

    function alignButtonsWithGraph() {
      setTimeout(() => {
        const graphDiv = document.getElementById("graph");
        const btnContainer = document.getElementById("button-container");
        if (!graphDiv || !btnContainer) return;
        const margin = graphDiv._fullLayout?.margin?.l ?? 80;
        btnContainer.style.paddingLeft = margin + "px";
      }, 100);
    }

    function styleActiveButton() {
      // Plotly renders updatemenu buttons as SVG <rect> elements.
      // The active button has class "active" on its parent <g>.
      // Inactive = transparent, active = #1B3C76 with white text.
      setTimeout(() => {
        const graphDiv = document.getElementById("graph");
        if (!graphDiv) return;
        graphDiv.querySelectorAll(".updatemenu-button").forEach(btn => {
          const rect = btn.querySelector("rect");
          if (!rect) return;
          const isActive = btn.classList.contains("active");
          rect.style.fill = isActive ? "#1B3C76" : "transparent";
          rect.style.stroke = "transparent";
        });
      }, 120);
    }

    function loadGraph(view) {
      window._lastView = view;
      const graphData = graphs[view];
      const layout = Object.assign({}, graphData.layout || {}, {
        autosize: true,
        height: 600,
        dragmode: false,
        plot_bgcolor: "rgba(0,0,0,0)",
        paper_bgcolor: "rgba(0,0,0,0)",
        "updatemenus[0].font.size": getResponsiveFontSize()
      });

      Plotly.newPlot("graph", graphData.data, layout, {
        responsive:     true,
        displayModeBar: false,
        scrollZoom:     false,
        doubleClick:    false
      }).then(() => {
        alignButtonsWithGraph();
        styleActiveButton();
      });
    }

    window.addEventListener("resize", () => {
      if (window._lastView) loadGraph(window._lastView);
    });

    loadGraph("adjusted");
  </script>

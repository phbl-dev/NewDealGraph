                        scrollZoom: false,     // disable wheel zoom
                        doubleClick: false     // prevent double-click zoom/reset
                    }
                ).then(() => {
                    resizeButtons();
                    alignButtonsWithGraph();
                });
            }

            // Event listeners
            window.addEventListener("resize", resizeButtons);
            loadGraph('adjusted');

            </script>

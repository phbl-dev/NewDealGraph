<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Udbytte</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    .card {
      width: 600px;
      height: 75px;
      border: 1px solid #F4F4F4;
      background-color: #F4F4F4;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 15px;
      box-sizing: border-box;
      justify-content: space-between;
    }
    .group  { display: flex; align-items: center; gap: 10px; }
    .col    { display: flex; flex-direction: column; }
    .col.right { text-align: right; }

    .amount, .percentage {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
      color: #333;
    }
    .meta { font-size: 12px; margin: 2px 0 0 0; color: #666; }
    .label { font-size: 12px; margin: 2px 0 0 0; }

    .tooltip { position: relative; display: inline-block; cursor: pointer; }
    .tooltip .tip {
      visibility: hidden;
      width: 250px;
      background-color: #555;
      color: #fff;
      text-align: left;
      padding: 5px 10px;
      border-radius: 5px;
      position: absolute;
      z-index: 1;
      top: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      white-space: normal;
      word-wrap: break-word;
    }
    .tooltip .tip::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: transparent transparent #555 transparent;
    }
    .tooltip:hover .tip { visibility: visible; opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <div class="group">
      <i class="fas fa-calendar" style="font-size:35px; opacity:70%;"></i>
      <div class="col">
        <h4 class="amount">38.9 DKK/andel</h4>
        <p class="meta">X-dag 22. jan 2024</p>
      </div>
    </div>

    <div class="group">
      <div class="col right">
        <h4 class="percentage">21%</h4>
        <p class="label">Udbytte</p>
      </div>
      <div class="tooltip">
        <i class="fas fa-circle-info" style="font-size:35px; opacity:70%;"></i>
        <span class="tip">Udbyttet fragik kursen den 22. januar 2025. Udlodningen skete på baggrund af et samlet afkast i 2024 på 46 %, og er baseret på ligningslovens krav til minimumsudlodning. Udbyttet er opgjort til 38,90 kr./andel.</span>
      </div>
    </div>
  </div>
</body>
</html>
